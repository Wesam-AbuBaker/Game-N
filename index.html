<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1930"><title>من سيربح المليون | انهيار حضارات بلاد الشام القديمة</title><style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#050b15;color:#f4f8ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #7ed5ff;outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{min-height:54px;background:#101f37;padding:7px clamp(10px,2vw,22px);display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{min-width:0}.heading strong{display:block;font-size:clamp(14px,1.6vw,19px)}.heading small{display:block;font-size:11px;color:#b3c9df}.actions{display:flex;gap:7px;align-items:center}.btn{background:#1b304e;color:#f6fbff;border:1px solid #496582;border-radius:11px;padding:8px 11px;min-height:40px;white-space:nowrap}.btn.primary{background:#087b9b;border-color:#35c4d4}.btn:disabled{opacity:.35;cursor:not-allowed}.viewer{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;position:relative;padding:4px 8px;background:#000}.stage{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;width:min(100%,calc((100dvh - 123px)*16/9));overflow:hidden;touch-action:none;user-select:none;transform-origin:center;box-shadow:0 0 0 1px #1b2633;background:#05080e}.slide{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.target{position:absolute;border:2px solid transparent;border-radius:12px;background:transparent;cursor:pointer;touch-action:manipulation;z-index:5}.target:hover,.target:focus-visible{background:rgba(84,189,245,.13);border-color:#58d7ff}.target.selected{border:3px solid #50d6ff;background:rgba(24,154,222,.22);box-shadow:inset 0 0 0 1px #a2edff,0 0 9px rgba(55,204,249,.40)}.target.selected:focus-visible{outline:3px solid #fff}.navBtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;direction:rtl}.navBtn .arrow{direction:ltr}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#101f37;padding:6px clamp(7px,2vw,20px);min-height:56px}.footSide{display:flex;align-items:center;gap:8px}.count{font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}.stepSelect{background:#1b304e;color:#fff;border:1px solid #496582;border-radius:9px;min-height:39px;padding:5px 9px;max-width:150px}.tiny{font-size:12px;color:#c3d3e4}.introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;background:#000;pointer-events:none!important}.introVideo[hidden]{display:none!important}.videoCover{position:absolute;inset:auto 15% 7%;z-index:7;display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}.videoCover .btn{background:#102d50df}.floating{position:fixed;z-index:15;top:10px;left:10px;display:none;gap:7px;align-items:center}.immersive .top,.immersive .foot{display:none}.immersive .viewer{padding:0}.immersive .stage{width:min(100%,calc(100dvh*16/9));max-height:100dvh}.immersive.showTools .floating{display:flex}.immersive.showTools .quickNav{display:flex}.quickNav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:none;gap:12px;z-index:15;align-items:center;background:#10223ce8;border-radius:14px;padding:8px}.quickNav .count{padding:0 4px}.zoomed .stage{cursor:grab}.hint{color:#b8cbdc;font-size:12px;margin:0}.toast{position:fixed;z-index:20;top:70px;left:50%;transform:translateX(-50%);background:#172d4b;color:#fff;padding:10px 16px;border-radius:12px;border:1px solid #537ba4;pointer-events:none}.toast[hidden]{display:none}@media(max-width:650px){.top{min-height:45px}.top .heading small{display:none}.top .btn{padding:5px 9px;min-height:36px}.foot{min-height:49px;gap:3px}.btn{padding:6px 8px;min-height:37px}.tiny{display:none}.stepSelect{max-width:100px}.stage{width:min(100%,calc((100dvh - 101px)*16/9))}.resultCard{max-width:380px}}@media(orientation:portrait) and (max-width:750px){.viewer{padding:2px}.stage{width:100%;height:auto;max-height:100%;}.foot{flex-wrap:wrap;justify-content:center}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="app" id="app"><header class="top"><div class="heading"><strong>من سيربح المليون؟</strong><small>انهيار حضارات بلاد الشام القديمة · الدراسات الاجتماعية · السابع/د · الأستاذ أسامة محمد إبراهيم الغويري</small></div><div class="actions"><button class="btn" id="reset">إعادة اللعبة</button><button class="btn" id="full">⛶ ملء الشاشة</button></div></header>
<section class="viewer" id="viewer" aria-label="شريحة اللعبة"><div class="stage" id="stage"><img class="slide" id="slide" alt="شريحة من لعبة من سيربح المليون" draggable="false"><video class="introVideo" id="intro" muted autoplay loop playsinline preload="auto" aria-hidden="true" tabindex="-1" hidden><source src="media/intro.mp4" type="video/mp4"></video><div id="hotspots"></div></div></section>
<footer class="foot"><div class="footSide"><button class="btn navBtn" id="prev"><svg aria-hidden="true" width="13" height="17" viewBox="0 0 20 24" style="flex:none"><path d="M6 3 L15 12 L6 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>السابق</button><select class="stepSelect" id="jump" aria-label="الانتقال إلى شريحة"></select><span class="count" id="counter">1 / 14</span><button class="btn primary navBtn" id="next">التالي<svg aria-hidden="true" width="13" height="17" viewBox="0 0 20 24" style="flex:none"><path d="M15 3 L6 12 L15 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="footSide"><button class="btn" id="zoomOut" aria-label="تصغير">−</button><span class="tiny" id="zoomText">100%</span><button class="btn" id="zoomIn" aria-label="تكبير">+</button><button class="btn" id="fit">إعادة الضبط</button></div></footer>
<div class="floating"><button class="btn" id="exitFull">⤢ خروج</button><button class="btn" id="floatZoomIn">＋</button><button class="btn" id="floatZoomOut">－</button><button class="btn" id="floatFit">↺</button></div><div class="quickNav"><button class="btn navBtn" id="qPrev"><svg aria-hidden="true" width="13" height="17" viewBox="0 0 20 24" style="flex:none"><path d="M6 3 L15 12 L6 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>السابق</button><span class="count" id="qCount">1 / 14</span><button class="btn primary navBtn" id="qNext">التالي<svg aria-hidden="true" width="13" height="17" viewBox="0 0 20 24" style="flex:none"><path d="M15 3 L6 12 L15 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></main>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const questionSlides=new Set([3,5,7,9,11,13]);
const storageKey='million-levant-student-choices-v2';
let answers={};
try{answers=JSON.parse(sessionStorage.getItem(storageKey)||'{}')||{}}catch{answers={}}
function saveAnswers(){try{sessionStorage.setItem(storageKey,JSON.stringify(answers))}catch{}}
const el=id=>document.getElementById(id);const app=el('app'),stage=el('stage'),slide=el('slide'),hotspots=el('hotspots'),intro=el('intro');let number=1,zoom=1,panX=0,panY=0,showTools=false,hideTimer=0,active=new Map(),moved=false,wasPinching=false,toastTimer=0;
const total=14;
for(let i=1;i<=total;i++){let opt=document.createElement('option');opt.value=i;opt.textContent='الشريحة '+i;el('jump').append(opt)}
function notify(msg){let t=el('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)}
function setZoom(z){zoom=Math.max(1,Math.min(4,z));if(zoom===1){panX=0;panY=0}applyTransform()}
function applyTransform(){const width=stage.offsetWidth,height=stage.offsetHeight;panX=Math.min(Math.max(panX,-width*(zoom-1)/2),width*(zoom-1)/2);panY=Math.min(Math.max(panY,-height*(zoom-1)/2),height*(zoom-1)/2);stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;app.classList.toggle('zoomed',zoom>1);el('zoomText').textContent=Math.round(zoom*100)+'%'}
function tryAutoVideo(){
  if(number!==2)return;
  intro.muted=true;intro.defaultMuted=true;intro.volume=0;
  intro.play().catch(()=>{ /* المتصفح قد يمنع التشغيل التلقائي؛ لا نعرض أدوات فوق الشريحة */ });
}
function changeSlide(n){
 n=Math.max(1,Math.min(total,n));number=n;
 intro.pause();intro.hidden=n!==2;
 slide.src='slides/slide-'+String(n).padStart(2,'0')+'.webp';slide.alt='الشريحة '+n+' من 14';
 el('counter').textContent=n+' / '+total;el('qCount').textContent=n+' / '+total;el('jump').value=n;
 el('prev').disabled=n===1;el('next').disabled=n===total;el('qPrev').disabled=n===1;el('qNext').disabled=n===total;
 setZoom(1);hotspots.replaceChildren();if(questionSlides.has(n))makeHotspots();
 if(n===2){try{intro.currentTime=0}catch{};tryAutoVideo()}
 if(app.classList.contains('immersive'))revealTools(false);
}
function makeHotspots(){
 const regions={A:[51,61,39,15],B:[11,61,38,15],C:[51,77,39,15],D:[11,77,38,15]};
 for(const [key,r] of Object.entries(regions)){
   const b=document.createElement('button');b.className='target';b.type='button';b.dataset.choice=key;
   b.setAttribute('aria-label','اختيار الإجابة '+key);b.setAttribute('aria-pressed',answers[number]===key?'true':'false');
   b.title='الإجابة '+key;
   Object.assign(b.style,{left:r[0]+'%',top:r[1]+'%',width:r[2]+'%',height:r[3]+'%'});
   if(answers[number]===key)b.classList.add('selected');
   b.addEventListener('click',e=>{e.stopPropagation();choose(key)});hotspots.append(b);
 }
}
function choose(key){
 // اختيار دون تصحيح: يحتفظ الطالب بالاختيار ويستطيع تعديله حتى ينتقل إلى سؤال آخر.
 answers[number]=key;saveAnswers();
 [...hotspots.children].forEach(b=>{const on=b.dataset.choice===key;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});
}
function revealTools(on=true){clearTimeout(hideTimer);showTools=on;app.classList.toggle('showTools',on);if(on&&app.classList.contains('immersive'))hideTimer=setTimeout(()=>revealTools(false),3300)}
function fullscreenState(){let on=!!document.fullscreenElement;app.classList.toggle('immersive',on);el('full').textContent=on?'⤢ خروج من ملء الشاشة':'⛶ ملء الشاشة';revealTools(false);setZoom(1)}document.addEventListener('fullscreenchange',fullscreenState);
async function toggleFull(){try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen()}catch(e){notify('لم يسمح المتصفح بملء الشاشة')}}
el('full').onclick=toggleFull;el('exitFull').onclick=toggleFull;el('next').onclick=el('qNext').onclick=()=>changeSlide(number+1);el('prev').onclick=el('qPrev').onclick=()=>changeSlide(number-1);el('jump').onchange=e=>changeSlide(+e.target.value);el('zoomIn').onclick=el('floatZoomIn').onclick=()=>setZoom(zoom+.25);el('zoomOut').onclick=el('floatZoomOut').onclick=()=>setZoom(zoom-.25);el('fit').onclick=el('floatFit').onclick=()=>setZoom(1);el('reset').onclick=()=>{if(confirm('هل تريد مسح جميع اختياراتك وإعادة اللعبة؟')){answers={};saveAnswers();changeSlide(1)}};
let startX=0,startY=0,lastDist=0,initialZoom=1,lastCenter=null;
function point(e){return {x:e.clientX,y:e.clientY}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,video'))return;stage.setPointerCapture(e.pointerId);active.set(e.pointerId,point(e));if(active.size===1){startX=e.clientX;startY=e.clientY;moved=false;wasPinching=false}else if(active.size===2){wasPinching=true;const [a,b]=[...active.values()];lastDist=distance(a,b);initialZoom=zoom}}, {passive:true});
stage.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);const now=point(e);active.set(e.pointerId,now);if(active.size===2){wasPinching=true;const [a,b]=[...active.values()];let dist=distance(a,b);if(lastDist>0)setZoom(initialZoom*dist/lastDist);moved=true}else if(active.size===1){if(Math.hypot(now.x-startX,now.y-startY)>12)moved=true;if(zoom>1){panX+=now.x-old.x;panY+=now.y-old.y;applyTransform()}}},{passive:true});
stage.addEventListener('pointerup',e=>{if(!active.has(e.pointerId))return;let endX=e.clientX,endY=e.clientY;active.delete(e.pointerId);if(active.size===0){if(!wasPinching&&zoom===1&&Math.abs(endX-startX)>70&&Math.abs(endY-startY)<65){changeSlide(number+(endX>startX?1:-1));return}if(!moved&&!wasPinching&&app.classList.contains('immersive'))revealTools(!showTools);wasPinching=false}}, {passive:true});stage.addEventListener('pointercancel',e=>{active.delete(e.pointerId);wasPinching=false});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.15:-.15))}},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')changeSlide(number+1);else if(e.key==='ArrowRight')changeSlide(number-1);else if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});
changeSlide(1);
</script></body></html>
